# =============================================================================
# Ollama systemd drop-in - tuned for a 16 GB RAM CPU-only host.
#
# This is a DROP-IN override for the packaged "ollama.service". It does NOT
# replace the unit; it only adds/overrides the Environment= settings below.
#
# INSTALL (do not start anything yourself):
#
#   1. Open the override editor (creates the drop-in directory for you):
#
#          sudo systemctl edit ollama
#
#      This opens an editor on:
#          /etc/systemd/system/ollama.service.d/override.conf
#
#   2. Paste the [Service] block from this file (everything below the header)
#      into that editor and save. Alternatively, install this file directly:
#
#          sudo install -D -m 0644 \
#              deploy/ollama-subnet.conf \
#              /etc/systemd/system/ollama.service.d/override.conf
#
#   3. Reload systemd and restart Ollama to apply:
#
#          sudo systemctl daemon-reload
#          sudo systemctl restart ollama
#
#   4. Verify the effective environment:
#
#          systemctl show ollama -p Environment
#          curl -s http://127.0.0.1:11434/api/tags | head
#
# -----------------------------------------------------------------------------
# IMPORTANT - network exposure:
#   This drop-in sets OLLAMA_HOST=0.0.0.0:11434 so the host's firewall (ufw)
#   can grant LAN-only access (see deploy/firewall.md). Ollama has NO built-in
#   authentication, so port 11434 MUST be firewalled to the local /24 subnet
#   and NEVER reachable from the WAN. Application clients should talk to the
#   authenticated gateway on :8080, not to Ollama on :11434 directly.
#
#   If you prefer the stricter posture, set OLLAMA_HOST=127.0.0.1:11434 here so
#   only the gateway (same host) can reach Ollama, and expose nothing on 11434.
# -----------------------------------------------------------------------------
# Tuning rationale (16 GB RAM, CPU inference):
#   OLLAMA_NUM_PARALLEL=1        one concurrent request; each parallel slot
#                                multiplies context memory. 1 avoids OOM.
#   OLLAMA_MAX_LOADED_MODELS=1   keep a single model resident (~5 GB for 7B).
#   OLLAMA_KEEP_ALIVE=5m         balance reload latency vs. memory pressure.
#   Do NOT run 30B+ models on this class of box.
# =============================================================================
[Service]
Environment=OLLAMA_HOST=0.0.0.0:11434
Environment=OLLAMA_KEEP_ALIVE=5m
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_MAX_LOADED_MODELS=1
