# =============================================================================
# dnsmasq-llm.conf - Home LLM Hub LAN DNS drop-in.
#
# Installed by deploy/install-llmhome.sh to /etc/dnsmasq.d/dnsmasq-llm.conf.
# It maps the friendly hostname "llm.home" to this host's LAN IP so every
# device on the WiFi can open http://llm.home.
#
# The installer rewrites the address= line below with the auto-detected LAN IP
# (ip route get 1.1.1.1). The 192.168.1.100 here is only a placeholder; if you
# edit this file by hand, set it to YOUR host's LAN address and restart dnsmasq.
#
# After installing this file you MUST also point your router's DHCP "DNS server"
# option at this host's IP, or only this machine will resolve llm.home.
# =============================================================================

# Map the hub hostname to this host. (One line per name; add aliases freely.)
address=/llm.home/192.168.1.100

# Optional convenience alias. The mDNS fallback (avahi) already provides
# llm.local automatically, but answering it here too is harmless on the LAN.
# address=/llm.local/192.168.1.100

# Do not read /etc/hosts entries we did not intend to publish; keep this drop-in
# self-contained and predictable. (Comment out if you rely on /etc/hosts.)
# no-hosts

# Only answer DNS on the LAN; never act as an open resolver to the WAN.
# Bind to the LAN interface/IP the installer detected (rewritten in place).
# listen-address is set by the installer's main dnsmasq config, not here, to
# avoid clobbering distro defaults; this drop-in stays limited to address=.

# Forward everything else to your existing upstream resolvers so normal browsing
# keeps working. systemd-resolved usually keeps real upstreams in
# /run/systemd/resolve/resolv.conf; the installer points dnsmasq there.
# (Configured in the main installer, listed here for documentation.)
#   resolv-file=/run/systemd/resolve/resolv.conf
